<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ঘড়ি</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans Bengali", "Hind Siliguri", "SolaimanLipi", sans-serif;
      --bg: #f5f7fb;
      --card: #ffffff;
      --accent: #3b82f6;
      --text: #0f172a;
      --muted: #64748b;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #e0ecff 0%, #f5f7fb 45%, #ffffff 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
      padding: 24px;
    }

    .clock-card {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 24px;
      justify-items: center;
      text-align: center;
    }

    .clock-face {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 10px solid #e2e8f0;
      position: relative;
      display: grid;
      place-items: center;
      background: #f8fafc;
    }

    .hand {
      position: absolute;
      bottom: 50%;
      transform-origin: bottom center;
      border-radius: 999px;
    }

    .hand.hour {
      width: 8px;
      height: 70px;
      background: #0f172a;
    }

    .hand.minute {
      width: 6px;
      height: 92px;
      background: #334155;
    }

    .hand.second {
      width: 3px;
      height: 100px;
      background: var(--accent);
    }

    .center-dot {
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      position: absolute;
    }

    .tick {
      position: absolute;
      width: 4px;
      height: 18px;
      background: #cbd5f5;
      top: 8px;
      left: 50%;
      transform-origin: center 112px;
    }

    .tick.major {
      height: 26px;
      background: #94a3b8;
    }

    .digital {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .date {
      font-size: 16px;
      color: var(--muted);
    }

    .label {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="clock-card">
    <div class="label">বাংলা ঘড়ি</div>
    <div class="clock-face" aria-label="ঘড়ি">
      <div class="hand hour" id="hour-hand"></div>
      <div class="hand minute" id="minute-hand"></div>
      <div class="hand second" id="second-hand"></div>
      <div class="center-dot"></div>
    </div>
    <div>
      <div class="digital" id="digital-time">--:--:--</div>
      <div class="date" id="digital-date">--</div>
    </div>
  </main>

  <script>
    const hourHand = document.getElementById("hour-hand");
    const minuteHand = document.getElementById("minute-hand");
    const secondHand = document.getElementById("second-hand");
    const digitalTime = document.getElementById("digital-time");
    const digitalDate = document.getElementById("digital-date");
    const clockFace = document.querySelector(".clock-face");

    for (let i = 0; i < 60; i += 1) {
      const tick = document.createElement("span");
      tick.className = "tick";
      if (i % 5 === 0) {
        tick.classList.add("major");
      }
      tick.style.transform = `translateX(-50%) rotate(${i * 6}deg)`;
      clockFace.appendChild(tick);
    }

    const timeFormatter = new Intl.DateTimeFormat("bn-BD", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
    });

    const dateFormatter = new Intl.DateTimeFormat("bn-BD", {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
    });

    const pad = (value) => String(value).padStart(2, "0");

    const updateClock = () => {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const secondDeg = seconds * 6;
      const minuteDeg = minutes * 6 + seconds * 0.1;
      const hourDeg = (hours % 12) * 30 + minutes * 0.5;

      secondHand.style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

      const fallbackTime = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
      digitalTime.textContent = timeFormatter.format(now) || fallbackTime;
      digitalDate.textContent = dateFormatter.format(now);
    };

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
